<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>矩陣待辦</title>
  <meta name="theme-color" content="#0e0e10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="矩陣">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="title-btn" id="titleBtn"></button>
      <div class="topbar-right" id="topActions"></div>
      <span class="sync-dot" id="syncDot" title="同步狀態"></span>
    </header>

    <main class="views">
      <section class="view view-matrix" id="viewMatrix" aria-label="矩陣">
        <div class="searchbar" id="searchbar" hidden>
          <label class="search-field"><span class="search-ico"></span><input id="searchInput" type="search" placeholder="搜尋任務" enterkeyhint="search"></label>
          <button class="link" id="searchCancel">取消</button>
        </div>
        <div class="filter-chip" id="filterChip" hidden></div>
        <div class="matrix" id="matrix"></div>
        <div class="search-results" id="searchResults" hidden></div>
      </section>

      <section class="view view-cal" id="viewCal" aria-label="行事曆">
        <div class="cal-head" id="calHead"></div>
        <div class="cal-day" id="calDay">
          <div class="week" id="week"></div>
          <div class="allday" id="allday"></div>
          <div class="timeline-wrap" id="timelineWrap"><div class="timeline" id="timeline"></div></div>
        </div>
        <div class="cal-month" id="calMonth" hidden>
          <div class="month" id="month"></div>
          <div class="month-list" id="monthList"></div>
        </div>
      </section>

      <section class="view view-settings" id="viewSettings" aria-label="設定">
        <div class="settings" id="settings"></div>
      </section>
    </main>

    <button class="fab" id="fab" aria-label="新增任務">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>

    <nav class="tabbar" id="tabbar">
      <button data-tab="matrix" class="active">
        <svg viewBox="0 0 24 24" width="24" height="24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        <span>矩陣</span>
      </button>
      <button data-tab="cal">
        <svg viewBox="0 0 24 24" width="24" height="24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>行事曆</span>
      </button>
      <button data-tab="settings">
        <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>設定</span>
      </button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="popover" id="popover" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
